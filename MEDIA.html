<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINO - HOME</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        /* Import Archivo Black from Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap');

        * {
            font-family: 'Archivo Black', 'Helvetica neue', Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden; /* Prevent horizontal scroll on entire page */
        }

        body {
            flex-direction: column;
            background-color: #fff;
            overflow-x: hidden; /* Prevent horizontal scroll */
        }

        .fade-in {
            opacity: 0;
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        a {
            text-decoration: none;
        }

        .et-hero-tabs {
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px;
            width: 100%;
            position: fixed;
            top: 0;
            text-align: center;
            z-index: 10;
            background-color: #fff;
        }

        .et-hero-tab img {
            height: 80%;
            width: auto;
        }

        .et-hero-tabs-container {
            overflow-y: hidden;
            padding: 17px;
            display: flex;
            flex-direction: row;
            top: 0;
            width: 80%;
            height: 90px;
            z-index: 10;
            text-align: right;
            background-color: transparent;
        }

        .et-hero-tab {
            display: flex;
            flex: 1;
            color: #000;
            background-color: #fff;
            letter-spacing: 0.1rem;
            font-size: 1.4rem;
            z-index: 999;
            transition: 0.5s;
        }

        .placeholder {
            height: 100px;
            width: 100%;
        }

        .fino-images {
            text-align: center;
            background-color: #fff;
        }

        .fino-images > * {
            transform: translateY(0px);
            transition: transform 0.6s;
        }

        .fino-images:hover > * {
            transform: translateY(-10px);
        }

        .fino-images img {
            height: 140px;
            width: 140px;
            margin: 3em 0.5em 3em 0.5em;
        }

        .Title {
            height: auto;
            min-height: 80px;
            width: 100%;
            background-color: #f1f1f1;
            text-align: center;
            overflow-y: visible;
            padding: 30px 20px 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .Title h1 {
            margin: 0;
            letter-spacing: 0.1rem;
            font-size: 4vw;
            color: #000;
            font-weight: bold;
        }

        .Title p {
            margin: 20px;
            letter-spacing: 0.1rem;
            font-size: 1.5vw;
        }

        /* FIXED GALLERY STYLES */
        .gallery {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            text-align: center;
            width: 100%;
            max-width: 100vw; /* Prevent overflow */
            margin: 40px 0; /* Remove horizontal margin */
            padding: 0 20px; /* Add padding instead */
            overflow: hidden; /* Prevent overflow */
        }

        .box {
            display: flex;
            width: 100%;
            max-width: 1200px; /* Set max width */
            gap: 20px; /* Use gap instead of margins for better control */
        }

        .column {
            display: flex;
            flex-direction: column;
            width: 33.333%; /* Equal width columns */
            min-width: 0; /* Allow columns to shrink */
        }

        .column img {
            width: 100%;
            height: auto;
            margin-bottom: 15px;
            object-fit: cover;
            transition: transform 0.2s ease-in-out;
        }

        .column img:hover {
            transform: translateY(-2px);
            cursor: pointer;
        }

        .footer {
            overflow-y: hidden;
            text-align: center;
            align-items: center;
            padding: 15px;
            width: 100%;
            height: 100px;
            background-color: #fff;
        }

        .footer-header {
            font-size: 20px;
            font-weight: bold;
        }

        .footer p {
            font-size: 10px;
        }

        .fa {
            text-decoration: none;
            color: black;
        }

        .fa:hover {
            opacity: 0.7;
        }

        /* MOBILE MENU STYLES */
        .ham-menu {
            padding: 30px;
        }

        .off-screen-menu {
            padding-top: 60px;
            background-color: #f1f1f1;
            height: 100vh;
            width: 100%;
            max-width: 300px;
            position: fixed;
            top: 0;
            left: -450px;
            display: flex;
            text-align: center;
            flex-direction: column;
            font-size: 3rem;
            transition: 0.3s ease;
            z-index: 10;
        }

        #mobile {
            margin-bottom: 10px;
            width: 50%;
            padding: 2%;
            margin-left: 30%;
            font-size: 1.5rem;
        }

        .off-screen-menu.active {
            left: 0;
        }

        .nav {
            padding: 20px;
            display: flex;
            background-color: #fff;
            z-index: 1000;
        }

        .ham {
            width: 100%;
            height: 90px;
            display: flex;
            flex-direction: row;
        }

        .fino-nav {
            z-index: 15;
            right: 50%;
            position: fixed;
            top: 2.5%;
            height: 50px;
            width: 50px;
        }

        .fino-nav img {
            height: 100%;
            width: 100%;
        }

        .ham-menu {
            height: 50px;
            width: 50px;
            position: fixed;
            left: 1%;
            top: 1.5%;
            z-index: 999;
        }

        .ham-menu span {
            height: 5px;
            width: 80%;
            background-color: #000;
            border-radius: 25px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: 0.3s ease;
            z-index: 999;
        }

        .ham-menu span:nth-child(1) {
            top: 25%;
            z-index: 999;
        }

        .ham-menu span:nth-child(2) {
            top: 75%;
            z-index: 999;
        }

        .ham-menu.active span:nth-child(1) {
            top: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            z-index: 999;
        }

        .ham-menu.active span:nth-child(2) {
            opacity: 0;
        }

        .ham-menu.active span:nth-child(3) {
            top: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            z-index: 999;
        }

        /* Add top margin to first title only */
        .fade-in .Title:first-of-type {
            margin-top: 100px;
            min-height: 50px;
            padding: 15px 20px 15px 20px;
        }
        @media (max-width: 920px) {
            .Title h1 {
                font-size: 6vw; /* Larger on mobile for better readability */
                margin: 30px 15px;
            }

            .gallery {
                padding: 0 15px; /* Reduce padding on mobile */
                margin: 20px 0;
            }

            .box {
                flex-direction: column; /* Stack columns vertically on mobile */
                gap: 15px;
            }

            .column {
                width: 100%; /* Full width on mobile */
                margin: 0;
            }

            .column img {
                margin-bottom: 10px;
            }

            .ham {
                display: block;
            }

            .et-hero-tab {
                display: none;
            }

            #mobile {
                display: block;
            }

            #fino {
                display: block;
            }
        }

        @media (max-width: 480px) {
            .Title {
                padding: 15px 10px 10px 10px;
                min-height: 50px;
            }

            .Title h1 {
                font-size: 8vw;
            }

            .fade-in .Title:first-of-type {
                margin-top: 80px;
            }

            .gallery {
                padding: 0 10px;
                margin: 15px 0;
            }

            .footer p {
                font-size: 8px;
            }
        }
    </style>
</head>
