<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css" /> 
    <title>FINO - HOME</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <link rel="shortcut icon" type="x-icon" href="Images/finobubble.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body {
            background-color: #fe4c29;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .fade-in {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .main-content {
            flex: 1;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .goodbye-text {
            max-width: 700px;
            text-align: center;
            color: #fff;
            font-family: 'Archivo Black', sans-serif;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .goodbye-text p {
            margin: 0;
            font-size: 1.4rem;
            line-height: 1.5;
        }

        .goodbye-text p:first-child {
            font-size: 2.2rem;
        }

        .goodbye-text a {
            color: #fff;
            text-decoration: underline;
        }
        
        .footer {
            margin-top: auto;
        }
    </style>
</head>
<body>

    <div class="fade-in">
        <div class="title"></div>
        
        <div class="main-content">
            <div class="goodbye-text">
                <p>&ldquo;forever.&rdquo;</p>
                <p>&ldquo;thank you for two years of FIN&Oslash;. thank you for letting me practice in front of you.&rdquo;</p>
                <p>&ldquo;for more creative work, go to <a href="https://rielyrufino.com" target="_blank">rielyrufino.com</a>&rdquo;</p>
            </div>
        </div>

        <footer class="footer">
            <div class="icons">
                <a href="https://www.instagram.com/areyoufino?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" class="fa fa-instagram"></a>
            </div>
            <p>based in dublin, ca</p>
            <p>DESIGNED, CREATED, AND PUT TOGETHER BY RIELY RUFINO</p>
            <p>DEVELOPED BY VARUN GUDISE</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
